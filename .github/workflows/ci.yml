name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate image variants
        run: node ./scripts/generate-images.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Serve `dist` (background)
        run: npx serve dist -l 5000 &

      - name: Wait for server
        run: npx wait-on http://localhost:5000 -t 15000

      - name: Performance (Lighthouse CI)
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: http://localhost:5000
          uploadArtifacts: false

      - name: Accessibility (pa11y)
        run: npx pa11y http://localhost:5000 --level WCAG2AA --timeout 30000
